name: CI and immutable image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_NAMESPACE: quality-reference-ci
      APP_PORT: '4300'
      APP_SOURCE_SHA: ${{ github.sha }}
      DATABASE_URL: postgres://reference_app:portfolio-ci-pass@127.0.0.1:5432/reference_app
      Q2_POSTGRES_IMAGE: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
      POSTGRES_PASSWORD: portfolio-ci-pass
      TEST_MODE: 'true'
      TEST_CONTROL_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    services:
      postgres:
        image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
        env:
          POSTGRES_DB: reference_app
          POSTGRES_USER: reference_app
          POSTGRES_PASSWORD: portfolio-ci-pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reference_app -d reference_app"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@10.9.4
      - name: Install locked dependencies
        run: npm ci
      - name: Verify runtime, OpenAPI, domain and PostgreSQL behavior
        run: npm run verify
      - name: Capture named Q2 datastore outcomes
        run: |
          mkdir -p work/audit-2026-10-21/Q2/logs
          set -o pipefail
          node --test --test-concurrency=1 --test-name-pattern='same-version writers are actually queued|claim creation and transition roll back|expired sessions are rejected|readiness reports datastore loss|reset admission rejects active work' tests/integration.test.js 2>&1 | tee work/audit-2026-10-21/Q2/logs/hosted-focused-integration.log
      - name: Check lock and transaction mutation controls
        run: scripts/verify-datastore-mutations.sh
      - name: Upload Q2 verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: q2-datastore-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/audit-2026-10-21/Q2/
          if-no-files-found: ignore
          retention-days: 30
      - name: Start isolated Docker Compose stack
        run: docker compose up --build --detach
      - name: Verify container readiness and claim journey
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:${APP_PORT}/health/ready > /tmp/quality-reference-ready.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/quality-reference-ready.json
          node scripts/smoke-compose.mjs
      - name: Collect Compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Stop isolated Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the immutable source-tagged multi-platform image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: APP_SOURCE_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.2.0
          sbom: true
          provenance: mode=max
      - name: Record immutable image identity
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo '### Published reference image'
            echo "- Source: \`${SOURCE_SHA}\`"
            echo "- Immutable image: \`${IMAGE}@${DIGEST}\`"
            echo '- Platforms: linux/amd64, linux/arm64'
            echo '- SBOM and provenance attestations: enabled'
          } >> "$GITHUB_STEP_SUMMARY"
