name: CI and immutable image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source SHA for a published target; defaults to main.
        required: false
        type: string
      image_ref:
        description: Exact QRA source-tagged or digest reference; defaults to the source-tagged image.
        required: false
        type: string
  schedule:
    - cron: '17 5 1 * *'

permissions:
  contents: read

jobs:
  security-advisory:
    name: Security advisory disposition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'push' && github.sha) || inputs.source_sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@10.9.4
      - name: Check security disposition policy fixtures
        run: npm run test:security-disposition
      - name: Start the production lockfile audit
        id: npm_audit
        continue-on-error: true
        run: |
          set -eu
          mkdir -p work/audit-2026-10-21/Q4/security
          out=work/audit-2026-10-21/Q4/security
          date -u +%Y-%m-%dT%H:%M:%SZ > "$out/npm-started-at.txt"
          npm --version > "$out/npm-version.txt"
          npm config get registry > "$out/npm-registry.txt"
          set +e
          npm audit --omit=dev --audit-level=low --json > "$out/npm-audit.json" 2> "$out/npm-audit.stderr"
          result=$?
          set -e
          date -u +%Y-%m-%dT%H:%M:%SZ > "$out/npm-completed-at.txt"
          printf '%s\n' "$result" > "$out/npm-exit-code.txt"
          printf 'exit_code=%s\n' "$result" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name == 'pull_request' || github.event_name == 'push'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare exact image targets
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
          IMAGE_REF_INPUT: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [[ -n "$SOURCE_SHA_INPUT" && ! "$SOURCE_SHA_INPUT" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'The source_sha input must be a full Git SHA.' >&2
            exit 1
          fi
          if [[ -n "$SOURCE_SHA_INPUT" && "$source_sha" != "$SOURCE_SHA_INPUT" ]]; then
            echo 'The checked-out source does not match the requested source SHA.' >&2
            exit 1
          fi
          if [[ ! "$source_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Source checkout is not pinned to a full commit SHA.' >&2
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          mkdir -p work/audit-2026-10-21/Q4/security
          if [[ "$EVENT_NAME" == 'pull_request' || "$EVENT_NAME" == 'push' ]]; then
            docker buildx build --platform linux/amd64 --load --tag qra-security:amd64 --build-arg "APP_SOURCE_SHA=$source_sha" .
            docker buildx build --platform linux/arm64 --load --tag qra-security:arm64 --build-arg "APP_SOURCE_SHA=$source_sha" .
            echo 'mode=candidate' >> "$GITHUB_OUTPUT"
            echo 'image_index_digest=' >> "$GITHUB_OUTPUT"
            echo 'image_amd64=qra-security:amd64' >> "$GITHUB_OUTPUT"
            echo 'digest_amd64=' >> "$GITHUB_OUTPUT"
            echo 'image_arm64=qra-security:arm64' >> "$GITHUB_OUTPUT"
            echo 'digest_arm64=' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          image_ref="$IMAGE_REF_INPUT"
          if [[ -z "$image_ref" ]]; then
            image_ref="ghcr.io/${GITHUB_REPOSITORY}:sha-${source_sha}"
          fi
          if [[ ! "$image_ref" =~ ^ghcr\.io/qa-test-automation-frameworks/quality-reference-application(:sha-[a-f0-9]{40}|@sha256:[a-f0-9]{64})$ ]]; then
            echo 'The image reference must be an exact QRA source tag or sha256 digest.' >&2
            exit 1
          fi
          tagged_sha="$(printf '%s\n' "$image_ref" | sed -n 's|^.*:sha-||p')"
          if [[ -n "$tagged_sha" && "$tagged_sha" != "$source_sha" ]]; then
            echo 'The source-tagged image SHA does not match the checked-out source.' >&2
            exit 1
          fi
          if [[ -z "$tagged_sha" && -z "$SOURCE_SHA_INPUT" ]]; then
            echo 'A digest image_ref requires an explicit source_sha input.' >&2
            exit 1
          fi
          docker buildx imagetools inspect "$image_ref" > work/audit-2026-10-21/Q4/security/image-inspect.txt
          index_digest="$(awk '$1 == "Digest:" { print $2; exit }' work/audit-2026-10-21/Q4/security/image-inspect.txt)"
          if [[ ! "$index_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'The published image index digest is missing or malformed.' >&2
            exit 1
          fi
          docker buildx imagetools inspect --raw "$image_ref" > work/audit-2026-10-21/Q4/security/image-index.json
          amd64_digest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] | if length == 1 then .[0] else error("expected exactly one linux/amd64 manifest") end' work/audit-2026-10-21/Q4/security/image-index.json)"
          arm64_digest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest] | if length == 1 then .[0] else error("expected exactly one linux/arm64 manifest") end' work/audit-2026-10-21/Q4/security/image-index.json)"
          for arch in amd64 arm64; do
            digest="$amd64_digest"
            if [[ "$arch" == arm64 ]]; then digest="$arm64_digest"; fi
            image="ghcr.io/$GITHUB_REPOSITORY@$digest"
            docker pull --platform "linux/$arch" "$image"
            image_source_sha="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            if [[ "$image_source_sha" != "$source_sha" ]]; then
              echo "The linux/$arch image revision label does not match source_sha." >&2
              exit 1
            fi
          done
          echo 'mode=published' >> "$GITHUB_OUTPUT"
          echo "image_index_digest=$index_digest" >> "$GITHUB_OUTPUT"
          echo "image_amd64=ghcr.io/${GITHUB_REPOSITORY}@${amd64_digest}" >> "$GITHUB_OUTPUT"
          echo "digest_amd64=$amd64_digest" >> "$GITHUB_OUTPUT"
          echo "image_arm64=ghcr.io/${GITHUB_REPOSITORY}@${arm64_digest}" >> "$GITHUB_OUTPUT"
          echo "digest_arm64=$arm64_digest" >> "$GITHUB_OUTPUT"
      - name: Scan the linux/amd64 image with Trivy
        id: trivy_amd64
        if: ${{ always() && steps.targets.outputs.image_amd64 != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ steps.targets.outputs.image_amd64 }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: work/audit-2026-10-21/Q4/security/trivy-linux-amd64.json
          exit-code: '0'
      - name: Scan the linux/arm64 image with Trivy
        id: trivy_arm64
        if: ${{ always() && steps.targets.outputs.image_arm64 != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ steps.targets.outputs.image_arm64 }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: work/audit-2026-10-21/Q4/security/trivy-linux-arm64.json
          exit-code: '0'
      - name: Record Trivy tool and database metadata
        if: always()
        continue-on-error: true
        run: |
          root=work/audit-2026-10-21/Q4/security
          mkdir -p work/audit-2026-10-21/Q4/security
          if command -v trivy >/dev/null 2>&1; then
            trivy version --format json > "$root/trivy-version-cli.json"
            db_metadata="$GITHUB_WORKSPACE/.cache/trivy/db/metadata.json"
            if [[ -s "$db_metadata" ]]; then
              cp "$db_metadata" "$root/trivy-db-metadata.json"
            else
              printf '{}\n' > "$root/trivy-db-metadata.json"
            fi
            TRIVY_EVIDENCE_DIR="$root" node --input-type=module <<'NODE'
            import { readFileSync, writeFileSync } from 'node:fs';
            const root = process.env.TRIVY_EVIDENCE_DIR;
            const version = JSON.parse(readFileSync(`${root}/trivy-version-cli.json`, 'utf8'));
            let vulnerabilityDB = null;
            try {
              vulnerabilityDB = JSON.parse(readFileSync(`${root}/trivy-db-metadata.json`, 'utf8'));
            } catch {}
            writeFileSync(`${root}/trivy-version.json`, `${JSON.stringify({ Version: version.Version, VulnerabilityDB: vulnerabilityDB }, null, 2)}\n`);
          NODE
          else
            printf '{}\n' > "$root/trivy-version.json"
          fi
      - name: Assemble scanner input manifest
        if: always()
        env:
          SOURCE_SHA: ${{ steps.targets.outputs.source_sha }}
          MODE: ${{ steps.targets.outputs.mode }}
          IMAGE_INDEX_DIGEST: ${{ steps.targets.outputs.image_index_digest }}
          IMAGE_AMD64: ${{ steps.targets.outputs.image_amd64 }}
          DIGEST_AMD64: ${{ steps.targets.outputs.digest_amd64 }}
          STATUS_AMD64: ${{ steps.trivy_amd64.outcome }}
          IMAGE_ARM64: ${{ steps.targets.outputs.image_arm64 }}
          DIGEST_ARM64: ${{ steps.targets.outputs.digest_arm64 }}
          STATUS_ARM64: ${{ steps.trivy_arm64.outcome }}
          NPM_STATUS: ${{ steps.npm_audit.outcome }}
          NPM_EXIT_CODE: ${{ steps.npm_audit.outputs.exit_code }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const read = (name) => { try { return readFileSync(name, 'utf8').trim(); } catch { return ''; } };
          const root = 'work/audit-2026-10-21/Q4/security/';
          const manifest = {
            sourceSha: process.env.SOURCE_SHA,
            target: {
              mode: process.env.MODE,
              imageIndexDigest: process.env.IMAGE_INDEX_DIGEST || null,
              platforms: {
                'linux/amd64': { imageRef: process.env.IMAGE_AMD64 || '', manifestDigest: process.env.DIGEST_AMD64 || null, stepStatus: process.env.STATUS_AMD64 || 'missing', reportPath: `${root}trivy-linux-amd64.json` },
                'linux/arm64': { imageRef: process.env.IMAGE_ARM64 || '', manifestDigest: process.env.DIGEST_ARM64 || null, stepStatus: process.env.STATUS_ARM64 || 'missing', reportPath: `${root}trivy-linux-arm64.json` },
              },
            },
            npm: {
              stepStatus: process.env.NPM_STATUS || 'missing',
              exitCode: process.env.NPM_EXIT_CODE === '' ? null : Number(process.env.NPM_EXIT_CODE),
              startedAt: read(`${root}npm-started-at.txt`),
              completedAt: read(`${root}npm-completed-at.txt`),
              npmVersion: read(`${root}npm-version.txt`),
              registry: read(`${root}npm-registry.txt`),
              reportPath: `${root}npm-audit.json`,
            },
            packageLockPath: 'package-lock.json',
            exceptionsPath: 'docs/security-exceptions.json',
            trivy: { versionPath: `${root}trivy-version.json` },
          };
          writeFileSync(`${root}scan-inputs.json`, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Evaluate scanner reports and exact-image exceptions
        if: always()
        run: node scripts/security-disposition.mjs work/audit-2026-10-21/Q4/security/scan-inputs.json work/audit-2026-10-21/Q4/security/disposition-summary.json
      - name: Add advisory disposition to the run summary
        if: always()
        run: |
          if test -s work/audit-2026-10-21/Q4/security/disposition-summary.json; then
            cat work/audit-2026-10-21/Q4/security/disposition-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain raw advisory, database, and disposition evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: q4-security-advisory-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/audit-2026-10-21/Q4/security/
          if-no-files-found: warn
          retention-days: 90

  verify:
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request')
    needs: security-advisory
    runs-on: ubuntu-latest
    env:
      APP_NAMESPACE: quality-reference-ci
      APP_PORT: '4300'
      APP_SOURCE_SHA: ${{ github.sha }}
      DATABASE_URL: postgres://reference_app:portfolio-ci-pass@127.0.0.1:5432/reference_app
      Q2_POSTGRES_IMAGE: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
      POSTGRES_PASSWORD: portfolio-ci-pass
      TEST_MODE: 'true'
      TEST_CONTROL_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    services:
      postgres:
        image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
        env:
          POSTGRES_DB: reference_app
          POSTGRES_USER: reference_app
          POSTGRES_PASSWORD: portfolio-ci-pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reference_app -d reference_app"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Fail the required verify check when the advisory gate fails
        if: needs.security-advisory.result != 'success'
        run: |
          echo 'The required advisory disposition did not pass.' >&2
          exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@10.9.4
      - name: Install locked dependencies
        run: npm ci
      - name: Verify runtime, OpenAPI, domain and PostgreSQL behavior
        run: npm run verify
      - name: Capture named Q2 datastore outcomes
        run: |
          mkdir -p work/audit-2026-10-21/Q2/logs
          set -o pipefail
          node --test --test-concurrency=1 --test-name-pattern='same-version writers are actually queued|claim creation and transition roll back|expired sessions are rejected|readiness reports datastore loss|reset admission rejects active work' tests/integration.test.js 2>&1 | tee work/audit-2026-10-21/Q2/logs/hosted-focused-integration.log
      - name: Check lock and transaction mutation controls
        run: scripts/verify-datastore-mutations.sh
      - name: Upload Q2 verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: q2-datastore-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/audit-2026-10-21/Q2/
          if-no-files-found: ignore
          retention-days: 30
      - name: Start isolated Docker Compose stack
        id: compose_start
        run: docker compose up --build --detach
      - name: Verify container readiness and claim journey
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:${APP_PORT}/health/ready > /tmp/quality-reference-ready.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/quality-reference-ready.json
          node scripts/smoke-compose.mjs
      - name: Collect Compose diagnostics on failure
        if: failure() && steps.compose_start.outcome != 'skipped'
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Stop isolated Docker Compose stack
        if: always() && steps.compose_start.outcome != 'skipped'
        run: docker compose down --volumes --remove-orphans

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the immutable source-tagged multi-platform image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          build-args: APP_SOURCE_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.2.0
          sbom: true
          provenance: mode=max
      - name: Record immutable image identity
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          {
            echo '### Published candidate reference image'
            echo "- Source: \`${SOURCE_SHA}\`"
            echo "- Immutable image: \`${IMAGE}@${DIGEST}\`"
            echo '- Platforms: linux/amd64, linux/arm64'
            echo '- SBOM and provenance attestations: enabled'
            echo '- This source-tagged image is awaiting its exact-digest security disposition.'
          } >> "$GITHUB_STEP_SUMMARY"

  published-advisory:
    name: Published image advisory disposition
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@10.9.4
      - name: Start the production lockfile audit
        id: npm_audit
        continue-on-error: true
        run: |
          set -eu
          mkdir -p work/audit-2026-10-21/Q4/security-published
          out=work/audit-2026-10-21/Q4/security-published
          date -u +%Y-%m-%dT%H:%M:%SZ > "$out/npm-started-at.txt"
          npm --version > "$out/npm-version.txt"
          npm config get registry > "$out/npm-registry.txt"
          set +e
          npm audit --omit=dev --audit-level=low --json > "$out/npm-audit.json" 2> "$out/npm-audit.stderr"
          result=$?
          set -e
          date -u +%Y-%m-%dT%H:%M:%SZ > "$out/npm-completed-at.txt"
          printf '%s\n' "$result" > "$out/npm-exit-code.txt"
          printf 'exit_code=%s\n' "$result" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the exact published image manifests
        id: targets
        env:
          SOURCE_SHA: ${{ github.sha }}
          PUBLISHED_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          set -euo pipefail
          out=work/audit-2026-10-21/Q4/security-published
          mkdir -p "$out"
          image_ref="ghcr.io/${GITHUB_REPOSITORY}@${PUBLISHED_DIGEST}"
          docker buildx imagetools inspect "$image_ref" > "$out/image-inspect.txt"
          index_digest="$(awk '$1 == "Digest:" { print $2; exit }' "$out/image-inspect.txt")"
          if [[ "$index_digest" != "$PUBLISHED_DIGEST" || ! "$index_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Published image digest did not match the publisher output.' >&2
            exit 1
          fi
          docker buildx imagetools inspect --raw "$image_ref" > "$out/image-index.json"
          amd64_digest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest] | if length == 1 then .[0] else error("expected exactly one linux/amd64 manifest") end' "$out/image-index.json")"
          arm64_digest="$(jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest] | if length == 1 then .[0] else error("expected exactly one linux/arm64 manifest") end' "$out/image-index.json")"
          for arch in amd64 arm64; do
            digest="$amd64_digest"
            if [[ "$arch" == arm64 ]]; then digest="$arm64_digest"; fi
            image="ghcr.io/$GITHUB_REPOSITORY@$digest"
            docker pull --platform "linux/$arch" "$image"
            image_source_sha="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            if [[ "$image_source_sha" != "$SOURCE_SHA" ]]; then
              echo "The published linux/$arch image revision label does not match the source SHA." >&2
              exit 1
            fi
          done
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "image_index_digest=$index_digest" >> "$GITHUB_OUTPUT"
          echo "image_amd64=ghcr.io/${GITHUB_REPOSITORY}@${amd64_digest}" >> "$GITHUB_OUTPUT"
          echo "digest_amd64=$amd64_digest" >> "$GITHUB_OUTPUT"
          echo "image_arm64=ghcr.io/${GITHUB_REPOSITORY}@${arm64_digest}" >> "$GITHUB_OUTPUT"
          echo "digest_arm64=$arm64_digest" >> "$GITHUB_OUTPUT"
      - name: Scan the published linux/amd64 image with Trivy
        id: trivy_amd64
        if: ${{ always() && steps.targets.outputs.image_amd64 != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ steps.targets.outputs.image_amd64 }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: work/audit-2026-10-21/Q4/security-published/trivy-linux-amd64.json
          exit-code: '0'
      - name: Scan the published linux/arm64 image with Trivy
        id: trivy_arm64
        if: ${{ always() && steps.targets.outputs.image_arm64 != '' }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ steps.targets.outputs.image_arm64 }}
          cache-dir: ${{ github.workspace }}/.cache/trivy
          scanners: vuln
          vuln-type: os,library
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          format: json
          output: work/audit-2026-10-21/Q4/security-published/trivy-linux-arm64.json
          exit-code: '0'
      - name: Record Trivy tool and database metadata
        if: always()
        continue-on-error: true
        run: |
          root=work/audit-2026-10-21/Q4/security-published
          mkdir -p work/audit-2026-10-21/Q4/security-published
          if command -v trivy >/dev/null 2>&1; then
            trivy version --format json > "$root/trivy-version-cli.json"
            db_metadata="$GITHUB_WORKSPACE/.cache/trivy/db/metadata.json"
            if [[ -s "$db_metadata" ]]; then
              cp "$db_metadata" "$root/trivy-db-metadata.json"
            else
              printf '{}\n' > "$root/trivy-db-metadata.json"
            fi
            TRIVY_EVIDENCE_DIR="$root" node --input-type=module <<'NODE'
            import { readFileSync, writeFileSync } from 'node:fs';
            const root = process.env.TRIVY_EVIDENCE_DIR;
            const version = JSON.parse(readFileSync(`${root}/trivy-version-cli.json`, 'utf8'));
            let vulnerabilityDB = null;
            try {
              vulnerabilityDB = JSON.parse(readFileSync(`${root}/trivy-db-metadata.json`, 'utf8'));
            } catch {}
            writeFileSync(`${root}/trivy-version.json`, `${JSON.stringify({ Version: version.Version, VulnerabilityDB: vulnerabilityDB }, null, 2)}\n`);
          NODE
          else
            printf '{}\n' > "$root/trivy-version.json"
          fi
      - name: Assemble scanner input manifest
        if: always()
        env:
          SOURCE_SHA: ${{ steps.targets.outputs.source_sha }}
          IMAGE_INDEX_DIGEST: ${{ steps.targets.outputs.image_index_digest }}
          IMAGE_AMD64: ${{ steps.targets.outputs.image_amd64 }}
          DIGEST_AMD64: ${{ steps.targets.outputs.digest_amd64 }}
          STATUS_AMD64: ${{ steps.trivy_amd64.outcome }}
          IMAGE_ARM64: ${{ steps.targets.outputs.image_arm64 }}
          DIGEST_ARM64: ${{ steps.targets.outputs.digest_arm64 }}
          STATUS_ARM64: ${{ steps.trivy_arm64.outcome }}
          NPM_STATUS: ${{ steps.npm_audit.outcome }}
          NPM_EXIT_CODE: ${{ steps.npm_audit.outputs.exit_code }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const read = (name) => { try { return readFileSync(name, 'utf8').trim(); } catch { return ''; } };
          const root = 'work/audit-2026-10-21/Q4/security-published/';
          const manifest = {
            sourceSha: process.env.SOURCE_SHA,
            target: {
              mode: 'published',
              imageIndexDigest: process.env.IMAGE_INDEX_DIGEST || null,
              platforms: {
                'linux/amd64': { imageRef: process.env.IMAGE_AMD64 || '', manifestDigest: process.env.DIGEST_AMD64 || null, stepStatus: process.env.STATUS_AMD64 || 'missing', reportPath: `${root}trivy-linux-amd64.json` },
                'linux/arm64': { imageRef: process.env.IMAGE_ARM64 || '', manifestDigest: process.env.DIGEST_ARM64 || null, stepStatus: process.env.STATUS_ARM64 || 'missing', reportPath: `${root}trivy-linux-arm64.json` },
              },
            },
            npm: {
              stepStatus: process.env.NPM_STATUS || 'missing',
              exitCode: process.env.NPM_EXIT_CODE === '' ? null : Number(process.env.NPM_EXIT_CODE),
              startedAt: read(`${root}npm-started-at.txt`),
              completedAt: read(`${root}npm-completed-at.txt`),
              npmVersion: read(`${root}npm-version.txt`),
              registry: read(`${root}npm-registry.txt`),
              reportPath: `${root}npm-audit.json`,
            },
            packageLockPath: 'package-lock.json',
            exceptionsPath: 'docs/security-exceptions.json',
            trivy: { versionPath: `${root}trivy-version.json` },
          };
          writeFileSync(`${root}scan-inputs.json`, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
      - name: Evaluate scanner reports and exact-image exceptions
        if: always()
        run: node scripts/security-disposition.mjs work/audit-2026-10-21/Q4/security-published/scan-inputs.json work/audit-2026-10-21/Q4/security-published/disposition-summary.json
      - name: Add published-image disposition to the run summary
        if: always()
        run: |
          if test -s work/audit-2026-10-21/Q4/security-published/disposition-summary.json; then
            cat work/audit-2026-10-21/Q4/security-published/disposition-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain raw published-image advisory and disposition evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: q4-published-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/audit-2026-10-21/Q4/security-published/
          if-no-files-found: warn
          retention-days: 90
